name: catalogo_interactivo
description: Catálogo interactivo de URLs organizados por categorías y subcategorías.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  url_launcher: ^6.2.0
  file_picker: ^6.1.1
  share_plus: ^7.2.1
  provider: ^6.1.1
  uuid: ^4.3.3
  cached_network_image: ^3.3.1
  flutter_slidable: ^3.0.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
